name: OG metadata check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-og-metadata:
    name: Validate Open Graph + Twitter Card tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run check
        run: node scripts/check-og-metadata.mjs
