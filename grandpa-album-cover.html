<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Album Cover :: Linford</title>
<meta name="description" content="Private, password-protected page for choosing Grandpa Ray's album cover.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#100c07; --panel:#1a140d; --panel2:#221a10; --border:#39301f;
    --ink:#f2ead9; --dim:#b9ac93; --faint:#8a7c62;
    --gold:#c9a24b; --gold2:#e7c877; --glow:rgba(201,162,75,0.16);
    --warm:#d98c4a; --bad:#d96a5a;
  }
  html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;line-height:1.55}
  a{color:var(--gold2);text-decoration:none} a:hover{text-decoration:underline}

  /* gate */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1100px 560px at 50% -10%, var(--glow), transparent), var(--bg);z-index:1000}
  .gate-card{width:100%;max-width:420px;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border);border-radius:18px;padding:40px 30px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,0.6)}
  .gate-emblem{font-size:44px;line-height:1;margin-bottom:14px}
  .gate-card h1{font-family:'Fraunces',serif;font-size:23px;letter-spacing:.3px;color:var(--gold2);margin-bottom:6px}
  .gate-card p{color:var(--dim);font-size:13.5px;margin-bottom:22px}
  .gate-card input{width:100%;padding:13px 15px;background:#0b0803;border:1px solid var(--border);border-radius:11px;
    color:var(--ink);font-size:15px;font-family:inherit;outline:none;text-align:center;letter-spacing:.5px}
  .gate-card input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--glow)}
  .gate-card button{width:100%;margin-top:12px;padding:13px;border:none;border-radius:11px;cursor:pointer;
    background:linear-gradient(180deg,var(--gold2),var(--gold));color:#241802;font-weight:700;font-size:15px;font-family:'Fraunces',serif}
  .gate-card button:hover{filter:brightness(1.07)}
  .gate-err{color:#e08a6a;font-size:13px;margin-top:14px;min-height:18px;font-weight:600}
  .gate-foot{margin-top:18px;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}

  #app{display:none} #app.live{display:block}
  .wrap{max-width:1000px;margin:0 auto;padding:42px 20px 80px}

  .hd{text-align:center;margin-bottom:30px}
  .eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--gold);margin-bottom:12px;font-weight:600}
  .hd h1{font-family:'Fraunces',serif;font-size:40px;line-height:1.1;color:var(--gold2);letter-spacing:.3px}
  .sub{color:var(--dim);margin:14px auto 0;font-size:15px;max-width:620px}

  .rec{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);
    border-left:3px solid var(--gold);border-radius:14px;padding:20px 22px;margin-bottom:30px}
  .rec-h{font-family:'Fraunces',serif;font-size:16px;color:var(--gold2);margin-bottom:8px}
  .rec p{color:var(--dim);font-size:14.5px} .rec strong,.note strong{color:var(--ink);font-weight:600}

  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media (max-width:720px){.gallery{grid-template-columns:1fr}.hd h1{font-size:32px}}
  .opt{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);
    border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .frame{background:#0b0803;aspect-ratio:4/3;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .frame img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
  figcaption{padding:18px 20px 20px}
  .cap-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .onum{font-family:'Fraunces',serif;font-size:15px;color:var(--gold);border:1px solid var(--border);
    border-radius:8px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .cap-top h3{font-family:'Fraunces',serif;font-size:18px;color:var(--ink);font-weight:600;flex:1;min-width:0}
  .tag{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .tag.gold{background:rgba(201,162,75,.16);color:var(--gold2);border:1px solid rgba(201,162,75,.4)}
  .tag.warm{background:rgba(217,140,74,.14);color:var(--warm);border:1px solid rgba(217,140,74,.35)}
  .tag.bad{background:rgba(217,106,90,.14);color:var(--bad);border:1px solid rgba(217,106,90,.35)}
  .cap-meta{font-family:ui-monospace,monospace;font-size:11px;color:var(--faint);margin-bottom:10px}
  figcaption p{color:var(--dim);font-size:13.5px;line-height:1.6}

  .note{margin-top:24px;background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:18px 20px}
  .note-h{font-family:'Fraunces',serif;font-size:15px;color:var(--gold2);margin-bottom:7px}
  .note p{color:var(--dim);font-size:14px}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:11px;
    font-family:ui-monospace,monospace;letter-spacing:.3px;border-top:1px solid var(--border);padding-top:20px}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <div class="gate-emblem">&#127925;</div>
    <h1>How Great Thou Art</h1>
    <p>Private family page. Enter the passphrase to view the album cover options.</p>
    <input id="pw" type="password" placeholder="passphrase" autocomplete="off" autofocus>
    <button id="unlock">Unlock</button>
    <div class="gate-err" id="err"></div>
    <div class="gate-foot">AES-256 / encrypted client-side</div>
  </div>
</div>

<script>
(function(){
  var gate=document.getElementById('gate'),pw=document.getElementById('pw'),
      err=document.getElementById('err'),app=document.getElementById('app');
  function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
  async function decrypt(password){
    var p=JSON.parse(document.getElementById('payload').textContent);
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iterations,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function boot(data){document.getElementById('main').innerHTML=data.content;app.classList.add('live');}
  async function attempt(){
    err.textContent='';var val=pw.value.trim();
    if(!val){err.textContent='Enter the passphrase.';return;}
    document.getElementById('unlock').textContent='Unlocking...';
    try{var data=await decrypt(val);try{localStorage.setItem('gpa-cover-pw',val);}catch(e){}gate.style.display='none';boot(data);}
    catch(e){err.textContent='That passphrase did not work. Try again.';document.getElementById('unlock').textContent='Unlock';pw.value='';pw.focus();}
  }
  document.getElementById('unlock').addEventListener('click',attempt);
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')attempt();});
  (function(){var saved=null;try{saved=localStorage.getItem('gpa-cover-pw');}catch(e){}if(!saved)return;
    decrypt(saved).then(function(d){gate.style.display='none';boot(d);}).catch(function(){try{localStorage.removeItem('gpa-cover-pw');}catch(e){}});})();
})();
</script>
