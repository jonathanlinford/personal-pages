<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jonny's Pages</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --card-hover: #1a1a28;
    --border: #1e1e2e;
    --text: #e4e4ef;
    --text-dim: #8888a0;
    --accent: #6366f1;
    --accent-light: #818cf8;
    --glow: rgba(99, 102, 241, 0.12);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(99,102,241,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .container {
    position: relative;
    max-width: 860px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  /* Header */
  header {
    margin-bottom: 48px;
  }
  header h1 {
    font-size: 36px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--text), var(--accent-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  header p {
    color: var(--text-dim);
    font-size: 15px;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    width: 16px;
    height: 16px;
  }
  .search-box input {
    width: 100%;
    padding: 12px 16px 12px 40px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box input::placeholder { color: var(--text-dim); }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--glow);
  }

  .sort-group {
    display: flex;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .sort-btn {
    padding: 12px 16px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    border-right: 1px solid var(--border);
  }
  .sort-btn:last-child { border-right: none; }
  .sort-btn:hover { color: var(--text); background: rgba(99,102,241,0.08); }
  .sort-btn.active {
    color: var(--accent-light);
    background: rgba(99,102,241,0.12);
  }
  .sort-btn .arrow {
    font-size: 10px;
    margin-left: 4px;
    display: inline-block;
    transition: transform 0.2s;
  }

  /* Page count */
  .page-count {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Page list */
  .page-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .page-card {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    transition: all 0.25s ease;
    animation: fadeIn 0.4s ease backwards;
  }
  .page-card:hover {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateX(6px);
    box-shadow: 0 4px 24px var(--glow);
  }

  .page-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: rgba(99,102,241,0.1);
    border: 1px solid rgba(99,102,241,0.15);
  }

  .page-info h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .page-info .desc {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.4;
  }

  .page-meta {
    text-align: right;
    flex-shrink: 0;
  }
  .page-meta .date {
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-dim);
  }
  .page-meta .tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 6px;
  }
  .tag-data { background: rgba(99,102,241,0.15); color: var(--accent-light); }
  .tag-personal { background: rgba(52,199,89,0.15); color: #34C759; }
  .tag-fun { background: rgba(255,159,10,0.15); color: #FF9F0A; }
  .tag-work { background: rgba(255,69,58,0.15); color: #FF453A; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  .footer {
    text-align: center;
    padding: 48px 0 0;
    color: var(--text-dim);
    font-size: 12px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .page-card { grid-template-columns: 40px 1fr; }
    .page-meta { grid-column: 2; text-align: left; }
    .controls { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>

<div class="container">
  <header>
    <h1>Jonny's Pages</h1>
    <p>A collection of personal pages, dashboards, and visualizations.</p>
  </header>

  <div class="controls">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Search pages..." autocomplete="off" />
    </div>
    <div class="sort-group">
      <button class="sort-btn active" data-sort="newest" onclick="setSort('newest')">Newest <span class="arrow">▼</span></button>
      <button class="sort-btn" data-sort="oldest" onclick="setSort('oldest')">Oldest <span class="arrow">▲</span></button>
      <button class="sort-btn" data-sort="alpha" onclick="setSort('alpha')">A–Z</button>
      <button class="sort-btn" data-sort="alpha-rev" onclick="setSort('alpha-rev')">Z–A</button>
    </div>
  </div>

  <div class="page-count" id="pageCount"></div>
  <div class="page-list" id="pageList"></div>

  <div class="footer">Auto-generated index</div>
</div>

<script>
/*
  PAGE REGISTRY
  =============
  Add new pages here. Each entry:
    - file:  filename (relative to this index)
    - title: display name
    - desc:  short description
    - icon:  emoji
    - date:  ISO date string (YYYY-MM-DD)
    - tag:   category tag (data, personal, fun, work)
*/
const pages = [
  {
    file: "kids-trip.html",
    title: "Kids @ Home — Japan Trip",
    desc: "Caretaker reference for Sally, Luke, Emerald & Georgia while we're in Japan (May 3–12, 2026). Schedules, contacts, twin care guide, meal plan.",
    icon: "👶",
    date: "2026-04-28",
    tag: "personal",
  },
  {
    file: "messaging-stats.html",
    title: "Messaging Universe",
    desc: "Interactive dashboard of 506K+ messages across iMessage, Messenger, and Google Chat — 18 years of conversations visualized.",
    icon: "💬",
    date: "2026-04-11",
    tag: "data",
  },
  {
    file: "joshua-lesson.html",
    title: "Be Strong and of a Good Courage",
    desc: "Primary lesson, May 24, 2026. Joshua 1–8; 23–24. Two scriptures, the stories of the Jordan, Jericho, and Rahab, and a closing on \"as for me and my house, we will serve the Lord.\"",
    icon: "📖",
    date: "2026-05-24",
    tag: "personal",
  },
  {
    file: "treasure-hunt.html",
    title: "The Hunt Room 🔒",
    desc: "Password-protected field intelligence for the Utah Treasure Hunt: full poem archive, line-by-line solves, trends, an interactive map, and the live 2026 decode.",
    icon: "🧭",
    date: "2026-05-30",
    tag: "fun",
  },
  {
    file: "judges-lesson.html",
    title: "The Lord Raised Up a Deliverer",
    desc: "Primary lesson, May 31, 2026. Judges 2–4; 6–8; 13–16. The repentance cycle of the judges, the stories of Deborah, Gideon, and Samson, two embedded videos, and Jesus Christ as the great Deliverer.",
    icon: "📖",
    date: "2026-05-31",
    tag: "personal",
  },
  {
    file: "antarctica-2027.html",
    title: "Antarctica: Where Grandpa Dyer Went",
    desc: "An idea I'm kicking around: taking Grandma Nancy to Marguerite Bay, where her father, polar explorer James Glenn Dyer, wintered in 1939–41. Voyage options, the route, maps, and costs.",
    icon: "🧭",
    date: "2026-06-02",
    tag: "personal",
  },
  {
    file: "gold-vs-sofi-plus.html",
    title: "Robinhood Gold vs SoFi Plus",
    desc: "Numbers-first comparison of the two fintech subscriptions: APY deltas, the 3% IRA match, 5% grocery card, break-even calculators, and the fine print. Rates as of June 10, 2026.",
    icon: "⚖️",
    date: "2026-06-10",
    tag: "personal",
  },
  // ── Add new pages above this line ──
];

const listEl = document.getElementById('pageList');
const countEl = document.getElementById('pageCount');
const searchEl = document.getElementById('search');

let currentSort = 'newest';

function setSort(mode) {
  currentSort = mode;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === mode));
  render();
}

function getFilteredSorted() {
  const q = searchEl.value.toLowerCase().trim();
  let filtered = pages;
  if (q) {
    filtered = pages.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.desc.toLowerCase().includes(q) ||
      p.tag.toLowerCase().includes(q)
    );
  }

  const sorted = [...filtered];
  switch (currentSort) {
    case 'newest':    sorted.sort((a, b) => b.date.localeCompare(a.date)); break;
    case 'oldest':    sorted.sort((a, b) => a.date.localeCompare(b.date)); break;
    case 'alpha':     sorted.sort((a, b) => a.title.localeCompare(b.title)); break;
    case 'alpha-rev': sorted.sort((a, b) => b.title.localeCompare(a.title)); break;
  }
  return sorted;
}

function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function render() {
  const items = getFilteredSorted();
  countEl.textContent = `${items.length} page${items.length !== 1 ? 's' : ''}`;

  if (items.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🔍</div>
        <p>No pages match your search.</p>
      </div>`;
    return;
  }

  listEl.innerHTML = items.map((p, i) => `
    <a href="${p.file}" class="page-card" style="animation-delay: ${i * 0.05}s">
      <div class="page-icon">${p.icon}</div>
      <div class="page-info">
        <h3>${highlightMatch(p.title)}</h3>
        <div class="desc">${highlightMatch(p.desc)}</div>
      </div>
      <div class="page-meta">
        <div class="date">${formatDate(p.date)}</div>
        <div class="tag tag-${p.tag}">${p.tag}</div>
      </div>
    </a>
  `).join('');
}

function highlightMatch(text) {
  const q = searchEl.value.trim();
  if (!q) return text;
  const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(regex, '<mark style="background:rgba(99,102,241,0.3);color:var(--text);border-radius:2px;padding:0 2px">$1</mark>');
}

searchEl.addEventListener('input', render);
render();
</script>

</body>
</html>
