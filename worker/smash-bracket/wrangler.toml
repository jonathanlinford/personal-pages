name = "smash-bracket"
main = "src/index.js"
compatibility_date = "2026-05-01"

# Single Durable Object holds the whole tournament. A DO gives us strongly
# consistent reads and serialized writes, which KV cannot promise -- important
# when several people report match results at the same time.
[[durable_objects.bindings]]
name = "BRACKET"
class_name = "BracketRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BracketRoom"]
