<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyprus HELOC :: Linford</title>
<meta name="description" content="Private, password-protected status page for the Linford Cyprus HELOC.">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0f1512; --panel:#151d19; --panel2:#1a231e; --border:#2a352e;
    --ink:#e9efe9; --dim:#a9b6ac; --faint:#71806f;
    --green:#4fae7a; --green2:#6fd39a; --gold:#d3b062; --gold2:#ecc97d;
    --glow:rgba(79,174,122,0.15);
  }
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;line-height:1.55}
  a{color:var(--green2);text-decoration:none} a:hover{text-decoration:underline}

  /* gate */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1100px 560px at 50% -10%, var(--glow), transparent), var(--bg);z-index:1000}
  .gate-card{width:100%;max-width:420px;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border);border-radius:18px;padding:40px 30px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,0.6)}
  .gate-emblem{font-size:44px;line-height:1;margin-bottom:14px}
  .gate-card h1{font-family:'Fraunces',serif;font-size:23px;letter-spacing:.3px;color:var(--gold2);margin-bottom:6px}
  .gate-card p{color:var(--dim);font-size:13.5px;margin-bottom:22px}
  .gate-card input{width:100%;padding:13px 15px;background:#0b100d;border:1px solid var(--border);border-radius:11px;
    color:var(--ink);font-size:15px;font-family:inherit;outline:none;text-align:center;letter-spacing:.5px}
  .gate-card input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--glow)}
  .gate-card button{width:100%;margin-top:12px;padding:13px;border:none;border-radius:11px;cursor:pointer;
    background:linear-gradient(180deg,var(--green2),var(--green));color:#08130c;font-weight:700;font-size:15px;font-family:'Fraunces',serif}
  .gate-card button:hover{filter:brightness(1.07)}
  .gate-err{color:#e08a6a;font-size:13px;margin-top:14px;min-height:18px;font-weight:600}
  .gate-foot{margin-top:18px;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}

  /* app */
  #app{display:none} #app.live{display:block}
  .wrap{max-width:920px;margin:0 auto;padding:40px 22px 70px}
  .hd{text-align:center;margin-bottom:30px}
  .hd-eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--faint);margin-bottom:10px}
  .hd h1{font-family:'Fraunces',serif;font-size:38px;color:var(--gold2);letter-spacing:.3px}
  .hd-sub{color:var(--dim);margin-top:8px;font-size:15px}
  .status{display:inline-flex;align-items:center;gap:9px;margin-top:16px;padding:8px 15px;border:1px solid var(--border);
    border-radius:999px;background:var(--panel);font-size:13px;color:var(--ink)}
  .status .dot{width:9px;height:9px;border-radius:50%;background:var(--green2);box-shadow:0 0 0 4px var(--glow)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);
    border-radius:16px;padding:24px 24px;margin-bottom:18px}
  .card h2{font-family:'Fraunces',serif;font-size:19px;color:var(--ink);margin-bottom:14px}
  .muted{color:var(--dim);font-size:14px} .muted.sm{font-size:12.5px;margin-top:10px;color:var(--faint)}
  .lender{font-size:18px;font-weight:700;color:var(--green2)}
  .contact{margin-top:14px;padding:14px;border:1px solid var(--border);border-radius:12px;background:#0d1310}
  .contact .who{font-weight:700;font-size:15px}
  .contact .role{color:var(--faint);font-size:12px;margin:3px 0 9px}
  .contact .lines a{display:block;font-size:14px;margin:3px 0}

  table.terms{width:100%;border-collapse:collapse}
  table.terms td{padding:9px 4px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:top}
  table.terms td:first-child{color:var(--dim)} table.terms td:last-child{text-align:right;font-weight:600}
  table.terms tr:last-child td{border-bottom:none}

  .timeline{list-style:none;margin-top:4px}
  .timeline li{padding:10px 0;border-bottom:1px solid var(--border);font-size:14.5px;display:flex;gap:14px}
  .timeline li:last-child{border-bottom:none}
  .timeline .when{flex:0 0 62px;color:var(--gold);font-weight:600;font-size:12.5px;padding-top:1px}
  .callout{margin-top:16px;padding:14px 16px;border-left:3px solid var(--gold);background:#0d1310;border-radius:0 10px 10px 0;font-size:14px;color:var(--ink)}

  ul.checks{list-style:none;margin-top:6px} ul.checks li{position:relative;padding:7px 0 7px 26px;font-size:14.5px;border-bottom:1px solid var(--border)}
  ul.checks li:last-child{border-bottom:none}
  ul.checks li:before{content:'';position:absolute;left:2px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--green)}
  ul.checks.arrow li:before{content:'\2192';top:6px;left:0;width:auto;height:auto;background:none;color:var(--gold);font-weight:700}

  .ft{margin-top:30px;text-align:center;color:var(--faint);font-size:12px}

  @media(max-width:680px){.grid2{grid-template-columns:1fr}.hd h1{font-size:30px}.wrap{padding:28px 16px 60px}}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <div class="gate-emblem">&#127968;</div>
    <h1>Cyprus HELOC</h1>
    <p>Private page for Lauren &amp; Jonny. Enter the passphrase.</p>
    <input id="pw" type="password" placeholder="passphrase" autocomplete="off" autofocus>
    <button id="unlock">Unlock</button>
    <div class="gate-err" id="err"></div>
    <div class="gate-foot">AES-256 / encrypted client-side</div>
  </div>
</div>

<div id="app"><div class="wrap"><div id="main"></div></div></div>

<script>
(function(){
  var gate=document.getElementById('gate'),pw=document.getElementById('pw'),
      err=document.getElementById('err'),app=document.getElementById('app');
  function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
  async function decrypt(password){
    var p=JSON.parse(document.getElementById('payload').textContent);
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iterations,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function boot(data){document.getElementById('main').innerHTML=data.content;app.classList.add('live');}
  async function attempt(){
    err.textContent='';var val=pw.value.trim();
    if(!val){err.textContent='Enter the passphrase.';return;}
    document.getElementById('unlock').textContent='Unlocking...';
    try{var data=await decrypt(val);try{localStorage.setItem('heloc-pw',val);}catch(e){}gate.style.display='none';boot(data);}
    catch(e){err.textContent='That passphrase did not work. Try again.';document.getElementById('unlock').textContent='Unlock';pw.value='';pw.focus();}
  }
  document.getElementById('unlock').addEventListener('click',attempt);
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')attempt();});
  (function(){var saved=null;try{saved=localStorage.getItem('heloc-pw');}catch(e){}if(!saved)return;
    decrypt(saved).then(function(d){gate.style.display='none';boot(d);}).catch(function(){try{localStorage.removeItem('heloc-pw');}catch(e){}});})();
})();
</script>
