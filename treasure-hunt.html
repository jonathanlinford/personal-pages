<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hunt Room :: Utah Treasure Hunt Intelligence</title>
<meta name="description" content="A password-protected field intelligence dossier for the annual Utah Treasure Hunt: full poem archive, line-by-line solves, trends, candidate locations, and a live 2026 decode.">
<meta property="og:title" content="The Hunt Room">
<meta property="og:description" content="Field intelligence for the Utah Treasure Hunt: poem archive, solves, trends, maps, and the 2026 decode. Locked.">
<meta property="og:image" content="https://jonathanlinford.github.io/personal-pages/treasure-hunt-og.png">
<meta property="og:url" content="https://jonathanlinford.github.io/personal-pages/treasure-hunt.html">
<meta property="og:type" content="website">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0c0a07; --panel:#15110b; --panel2:#1c1710; --border:#2c2417;
    --ink:#ece3d0; --dim:#a99a7d; --faint:#6f6650;
    --gold:#c9a24b; --gold2:#e7c06a; --ember:#b5532a; --green:#5fa463; --blood:#8a2f24;
    --parch:#e8dcc0;
    --glow:rgba(201,162,75,0.14);
  }
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;line-height:1.55}
  a{color:var(--gold2);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------- GATE ---------- */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1200px 600px at 50% -10%, rgba(201,162,75,0.10), transparent), var(--bg);z-index:1000}
  .gate-card{width:100%;max-width:420px;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border);border-radius:18px;padding:38px 30px;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,0.6)}
  .gate-emblem{font-size:46px;line-height:1;margin-bottom:14px}
  .gate-card h1{font-family:'Cinzel',serif;font-size:23px;letter-spacing:1px;color:var(--gold2);margin-bottom:6px}
  .gate-card p{color:var(--dim);font-size:13.5px;margin-bottom:22px}
  .gate-card input{width:100%;padding:13px 15px;background:#0e0b06;border:1px solid var(--border);
    border-radius:11px;color:var(--ink);font-size:15px;font-family:inherit;outline:none;text-align:center;letter-spacing:1px}
  .gate-card input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--glow)}
  .gate-card button{width:100%;margin-top:12px;padding:13px;border:none;border-radius:11px;cursor:pointer;
    background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a2008;font-weight:700;font-size:15px;font-family:'Cinzel',serif;letter-spacing:.5px}
  .gate-card button:hover{filter:brightness(1.07)}
  .gate-err{color:var(--ember);font-size:13px;margin-top:14px;min-height:18px;font-weight:600}
  .gate-foot{margin-top:18px;color:var(--faint);font-size:11px;font-family:'JetBrains Mono',monospace}

  /* ---------- APP LAYOUT ---------- */
  #app{display:none}
  #app.live{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
  #bg{position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(900px 500px at 80% -5%, rgba(181,83,42,0.07), transparent),
      radial-gradient(700px 500px at 0% 100%, rgba(201,162,75,0.06), transparent)}

  /* sidebar */
  .side{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border-right:1px solid var(--border);padding:22px 14px;z-index:5}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
  .brand .mark{font-size:24px}
  .brand h2{font-family:'Cinzel',serif;font-size:16px;color:var(--gold2);letter-spacing:.5px;line-height:1.15}
  .brand small{display:block;color:var(--faint);font-size:10.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
  nav.menu{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  .navlink{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--dim);
    font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:.15s}
  .navlink .ic{width:20px;text-align:center;font-size:15px}
  .navlink:hover{background:rgba(201,162,75,0.07);color:var(--ink)}
  .navlink.active{background:rgba(201,162,75,0.13);color:var(--gold2);border-color:rgba(201,162,75,0.25)}
  .side-foot{margin-top:18px;padding:12px 10px;border-top:1px solid var(--border);color:var(--faint);font-size:11px;font-family:'JetBrains Mono',monospace}

  /* main */
  main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:38px 30px 90px;width:100%}
  .sec{display:none;animation:fade .35s ease}
  .sec.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .topbar{display:none}
  .crumb{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
  h1.sec-title{font-family:'Cinzel',serif;font-size:30px;color:var(--gold2);margin-bottom:6px;letter-spacing:.5px}
  .sec-lead{color:var(--dim);font-size:15px;margin-bottom:26px;max-width:720px}
  h3{font-family:'Cinzel',serif;color:var(--ink);font-size:19px;margin:30px 0 12px;letter-spacing:.3px}
  h4{font-size:15px;color:var(--gold2);margin:20px 0 8px;font-weight:700}
  p{margin:0 0 12px;color:var(--ink)}
  .muted{color:var(--dim)}
  ul,ol{margin:0 0 14px 20px}
  li{margin:5px 0;color:var(--ink)}
  strong{color:#fff}
  hr{border:none;border-top:1px solid var(--border);margin:26px 0}

  .grid{display:grid;gap:16px}
  .cols-2{grid-template-columns:repeat(2,1fr)}
  .cols-3{grid-template-columns:repeat(3,1fr)}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:14px;padding:18px 18px}
  .card h4{margin-top:0}
  .stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center}
  .stat .n{font-family:'Cinzel',serif;font-size:30px;color:var(--gold2);line-height:1}
  .stat .l{color:var(--dim);font-size:12px;margin-top:6px;text-transform:uppercase;letter-spacing:.6px}

  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:2px 4px 2px 0}
  .pill.gold{background:rgba(201,162,75,0.16);color:var(--gold2)}
  .pill.green{background:rgba(95,164,99,0.16);color:var(--green)}
  .pill.red{background:rgba(181,83,42,0.18);color:#e08a5f}
  .pill.dim{background:rgba(169,154,125,0.12);color:var(--dim)}

  table{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:13.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--gold2);font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  tr:hover td{background:rgba(201,162,75,0.04)}

  .poembox{background:#0e0b06;border:1px solid var(--border);border-radius:14px;padding:8px;margin:14px 0}
  .pline{display:block;width:100%;text-align:left;background:none;border:none;border-radius:9px;padding:11px 14px;
    color:var(--parch);font-family:'Cinzel',serif;font-size:16px;cursor:pointer;border-left:3px solid transparent;transition:.15s}
  .pline:hover{background:rgba(201,162,75,0.07)}
  .pline.open{background:rgba(201,162,75,0.1);border-left-color:var(--gold)}
  .pline .ix{color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:11px;margin-right:10px}
  .pann{display:none;padding:4px 16px 14px 30px}
  .pline.open + .pann{display:block;animation:fade .25s ease}
  .pann .row{font-size:13.5px;color:var(--dim);margin:4px 0}
  .pann .lab{color:var(--gold2);font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;margin-right:6px}

  .acc{border:1px solid var(--border);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--panel)}
  .acc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;cursor:pointer}
  .acc-head:hover{background:rgba(201,162,75,0.05)}
  .acc-head .yr{font-family:'Cinzel',serif;font-size:18px;color:var(--gold2)}
  .acc-head .sub{color:var(--dim);font-size:12.5px}
  .acc-head .tw{color:var(--faint);font-size:18px;transition:.2s}
  .acc.open .acc-head .tw{transform:rotate(45deg);color:var(--gold)}
  .acc-body{display:none;padding:4px 18px 20px;border-top:1px solid var(--border)}
  .acc.open .acc-body{display:block}
  .acc-body pre{white-space:pre-wrap;font-family:'Cinzel',serif;color:var(--parch);font-size:14px;background:#0e0b06;border:1px solid var(--border);border-radius:10px;padding:14px;margin:10px 0}

  iframe{border:0;border-radius:12px;width:100%}
  .mapwrap{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin:12px 0}
  #map{height:460px;width:100%;background:#0e0b06}
  .leaflet-popup-content-wrapper{background:var(--panel2);color:var(--ink);border:1px solid var(--border)}
  .leaflet-popup-tip{background:var(--panel2)}
  .leaflet-popup-content{font-family:'Inter',sans-serif}
  .leaflet-popup-content b{color:var(--gold2);font-family:'Cinzel',serif}

  .vidgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .vid{aspect-ratio:16/9}
  .vid iframe{height:100%}

  .callout{border-left:3px solid var(--gold);background:rgba(201,162,75,0.06);border-radius:0 10px 10px 0;padding:14px 16px;margin:14px 0}
  .callout.red{border-left-color:var(--ember);background:rgba(181,83,42,0.07)}
  .callout.green{border-left-color:var(--green);background:rgba(95,164,99,0.07)}
  .callout h4{margin-top:0}

  .reslist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .res{display:block;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:15px 16px}
  .res:hover{border-color:var(--gold);text-decoration:none;transform:translateX(4px);transition:.15s}
  .res .t{color:var(--gold2);font-weight:700;font-size:14.5px}
  .res .d{color:var(--dim);font-size:12.5px;margin-top:3px}

  textarea.notes{width:100%;min-height:150px;background:#0e0b06;border:1px solid var(--border);border-radius:12px;
    color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:13px;padding:14px;resize:vertical;outline:none}
  textarea.notes:focus{border-color:var(--gold)}
  .savebtn{margin-top:8px;padding:9px 16px;border:none;border-radius:10px;background:var(--gold);color:#2a2008;font-weight:700;cursor:pointer;font-size:13px}

  .fitmatrix td .y{color:var(--green);font-weight:700}
  .fitmatrix td .n{color:var(--faint)}
  .fitmatrix td .q{color:var(--gold2)}

  .ribbon{display:inline-block;background:var(--blood);color:#fff;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    padding:3px 9px;border-radius:5px;letter-spacing:1px;text-transform:uppercase}

  .parch-toggle{border:1px solid var(--border);border-radius:12px;background:var(--panel);margin:16px 0;overflow:hidden}
  .parch-toggle summary{cursor:pointer;padding:13px 18px;color:var(--gold2);font-family:'Cinzel',serif;font-size:15px;list-style:none}
  .parch-toggle summary::-webkit-details-marker{display:none}
  .parch-toggle summary::before{content:'+ ';color:var(--gold)}
  .parch-toggle[open] summary::before{content:'- '}
  .parch-toggle summary:hover{background:rgba(201,162,75,0.06)}
  .parch-body{padding:0 18px 18px}
  .poemimg{display:block;max-width:430px;width:100%;margin:0 auto;border-radius:10px;border:1px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.5)}

  /* mobile */
  .menu-toggle{display:none}
  @media(max-width:860px){
    #app.live{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;width:80%;max-width:300px;transform:translateX(-105%);transition:.25s;box-shadow:0 0 60px rgba(0,0,0,.7)}
    .side.open{transform:translateX(0)}
    .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:8;
      background:var(--panel);border-bottom:1px solid var(--border);padding:12px 16px}
    .menu-toggle{display:inline-flex;background:none;border:1px solid var(--border);color:var(--gold2);border-radius:9px;padding:7px 11px;font-size:18px;cursor:pointer}
    .topbar .tt{font-family:'Cinzel',serif;color:var(--gold2);font-size:15px}
    main{padding:22px 18px 80px}
    .cols-2,.cols-3,.vidgrid,.reslist{grid-template-columns:1fr}
    h1.sec-title{font-size:24px}
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:4}
    .scrim.on{display:block}
  }
</style>
</head>
<body>
<div id="bg"></div>

<div id="gate">
  <div class="gate-card">
    <div class="gate-emblem">&#129683;</div>
    <h1>The Hunt Room</h1>
    <p>Utah Treasure Hunt field intelligence. This dossier is sealed. Speak the word to enter.</p>
    <input id="pw" type="password" placeholder="passphrase" autocomplete="off" autofocus>
    <button id="unlock">Unseal</button>
    <div class="gate-err" id="err"></div>
    <div class="gate-foot">AES-256 / encrypted client-side</div>
  </div>
</div>

<div id="app">
  <aside class="side" id="side">
    <div class="brand"><span class="mark">&#129683;</span><div><h2>The Hunt Room</h2><small>UTAH TREASURE HUNT // INTEL</small></div></div>
    <nav class="menu" id="menu"></nav>
    <div class="side-foot">7th annual &middot; $25,000<br>poem live: May 30, 2026<br><span style="color:var(--ember)">decode in progress</span><br><a href="#" id="forget" style="color:var(--faint);font-size:10.5px;text-decoration:underline">lock &amp; forget password</a></div>
  </aside>
  <div>
    <div class="topbar"><button class="menu-toggle" id="mtog">&#9776;</button><span class="tt" id="mtitle">Overview</span></div>
    <main id="main"></main>
  </div>
</div>

<script>
(function(){
  var gate=document.getElementById('gate'), pw=document.getElementById('pw'),
      err=document.getElementById('err'), app=document.getElementById('app');

  function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}

  async function decrypt(password){
    var p=JSON.parse(document.getElementById('payload').textContent);
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(p.salt),iterations:p.iterations,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  async function attempt(){
    err.textContent='';
    var val=pw.value.trim();
    if(!val){err.textContent='Enter the passphrase.';return;}
    document.getElementById('unlock').textContent='Unsealing...';
    try{
      var data=await decrypt(val);
      try{localStorage.setItem('huntroom-pw',val);}catch(e){}
      gate.style.display='none';
      boot(data);
    }catch(e){
      err.textContent='That is not the word. Try again.';
      document.getElementById('unlock').textContent='Unseal';
      pw.value='';pw.focus();
    }
  }
  document.getElementById('unlock').addEventListener('click',attempt);
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')attempt();});

  // Auto-unlock if a working password was saved on a previous visit.
  (function(){
    var saved=null;
    try{saved=localStorage.getItem('huntroom-pw');}catch(e){}
    if(!saved)return;
    decrypt(saved).then(function(d){gate.style.display='none';boot(d);})
      .catch(function(){try{localStorage.removeItem('huntroom-pw');}catch(e){}});
  })();

  // ---------------- APP BOOT (after unlock) ----------------
  function boot(data){
    document.getElementById('main').innerHTML=data.content;
    app.classList.add('live');

    var secs=Array.prototype.slice.call(document.querySelectorAll('#main .sec'));
    var menu=document.getElementById('menu');
    var links=[];
    secs.forEach(function(s,i){
      var a=document.createElement('div');
      a.className='navlink';a.dataset.target=s.id;
      a.innerHTML='<span class="ic">'+(s.dataset.icon||'&#9670;')+'</span><span>'+(s.dataset.label||s.id)+'</span>';
      a.addEventListener('click',function(){go(s.id);});
      menu.appendChild(a);links.push(a);
    });

    function go(id){
      secs.forEach(function(s){s.classList.toggle('show',s.id===id);});
      links.forEach(function(a){a.classList.toggle('active',a.dataset.target===id);});
      var cur=document.getElementById(id);
      document.getElementById('mtitle').textContent=cur?(cur.dataset.label||id):id;
      if(history.replaceState)history.replaceState(null,'','#'+id); else location.hash=id;
      closeSide();
      window.scrollTo(0,0);
      if(id==='map')initMap();
    }
    window._go=go;

    // poem decoder
    document.querySelectorAll('.pline').forEach(function(b){
      b.addEventListener('click',function(){b.classList.toggle('open');});
    });
    // accordions
    document.querySelectorAll('.acc-head').forEach(function(h){
      h.addEventListener('click',function(){h.parentElement.classList.toggle('open');});
    });
    // notes persistence
    document.querySelectorAll('textarea.notes').forEach(function(t){
      var k='huntroom-'+(t.dataset.key||'notes');
      t.value=localStorage.getItem(k)||t.value;
      var btn=t.parentElement.querySelector('.savebtn');
      if(btn)btn.addEventListener('click',function(){localStorage.setItem(k,t.value);btn.textContent='Saved';setTimeout(function(){btn.textContent='Save notes';},1200);});
    });

    // mobile menu
    document.getElementById('mtog').addEventListener('click',function(){
      document.getElementById('side').classList.toggle('open');
      document.getElementById('scrim').classList.toggle('on');
    });
    document.getElementById('scrim').addEventListener('click',closeSide);
    function closeSide(){document.getElementById('side').classList.remove('open');document.getElementById('scrim').classList.remove('on');}

    var fg=document.getElementById('forget');
    if(fg)fg.addEventListener('click',function(e){e.preventDefault();try{localStorage.removeItem('huntroom-pw');}catch(_){}location.reload();});

    var start=(location.hash||'').replace('#','');
    go(secs.some(function(s){return s.id===start;})?start:secs[0].id);
  }

  // ---------------- LEAFLET MAP ----------------
  var mapDone=false;
  function initMap(){
    if(mapDone||typeof L==='undefined')return;
    var el=document.getElementById('map');if(!el)return;
    var node=document.getElementById('mapdata');if(!node)return;
    var pts=JSON.parse(node.textContent);
    mapDone=true;
    var map=L.map('map',{scrollWheelZoom:false}).setView([40.75,-111.85],9);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
      attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19}).addTo(map);
    var bounds=[];
    pts.forEach(function(p){
      var color=p.type==='candidate'?'#c9a24b':'#b5532a';
      var m=L.circleMarker([p.lat,p.lng],{radius:8,color:color,fillColor:color,fillOpacity:.85,weight:2}).addTo(map);
      m.bindPopup('<b>'+p.title+'</b><br>'+p.note);
      bounds.push([p.lat,p.lng]);
    });
    if(bounds.length)map.fitBounds(bounds,{padding:[40,40]});
    setTimeout(function(){map.invalidateSize();},200);
  }
})();
</script>
</body>
