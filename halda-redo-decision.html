(function(){
 const enc=new TextEncoder(),dec=new TextDecoder();
 const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 async function decrypt(password){const e=JSON.parse(document.getElementById('payload').textContent);const material=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct)))}
 function tabs(selector,panelSelector){document.querySelectorAll(selector).forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll(selector).forEach(x=>x.classList.remove('active'));document.querySelectorAll(panelSelector).forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.target).classList.add('active')}))}
 function boot(content){document.getElementById('app').innerHTML=content;document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';tabs('.tab','.chart-panel');tabs('.equity-tab','.equity-panel');localStorage.setItem('decision-room-pass',document.getElementById('pw').value)}
 async function unlock(){const pw=document.getElementById('pw').value;const err=document.getElementById('err');err.textContent='';try{boot(await decrypt(pw))}catch(e){err.textContent='That passphrase did not work.'}}
 document.getElementById('unlock').addEventListener('click',unlock);document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});const saved=localStorage.getItem('decision-room-pass');if(saved){document.getElementById('pw').value=saved;unlock()}
