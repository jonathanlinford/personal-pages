<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>2027 Health Plan Calculator</title>
<!-- og-check-skip: Unlisted password-protected calculator. -->
<style>
  :root { color-scheme: light; --ink:#152e33; --muted:#495f62; --paper:#f5f6ef; --card:#fff; --line:#dbe3dc; --teal:#076657; --mint:#dcefe3; --rust:#a54223; --dark:#0e302f; --cream:#f1f6ec; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.55; color:var(--ink); background:var(--paper); }
  *, *::before, *::after { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; }
  h1,h2,h3,p { margin:0; }
  h1,h2,h3 { line-height:1.12; letter-spacing:-.035em; }
  h2 { font-size:clamp(1.8rem,4vw,2.75rem); }
  h3 { font-size:1.22rem; }
  a { color:var(--teal); text-underline-offset:.18em; }
  button,input,select { font:inherit; }
  :focus-visible { outline:3px solid #bf6a36; outline-offset:3px; }
  .shell { width:min(1120px,calc(100% - 3rem)); margin-inline:auto; }
  .eyebrow { font-size:.75rem; font-weight:750; letter-spacing:.13em; text-transform:uppercase; }
  .small { font-size:.86rem; }
  .muted { color:var(--muted); }
  .button { display:inline-flex; align-items:center; justify-content:center; min-height:44px; border:1px solid transparent; border-radius:.65rem; padding:.56rem .95rem; font-weight:700; text-decoration:none; cursor:pointer; }
  .button:disabled { opacity:.65; cursor:wait; }
  .primary { color:#fff; background:var(--teal); }
  .primary:hover { background:#074e43; }
  .secondary { color:var(--teal); background:#fff; border-color:#b3d2c6; }
  .quiet { color:var(--cream); background:transparent; border-color:#698581; font-size:.88rem; white-space:nowrap; }
  .quiet:hover { background:#284947; }
  .gate { min-height:100svh; display:grid; place-items:center; padding:2rem 1rem; background:radial-gradient(ellipse at 80% 0%,#285b50,var(--dark) 55%); }
  .gate-card { width:min(100%,480px); border-radius:1.5rem; padding:clamp(1.5rem,6vw,2.7rem); background:var(--cream); box-shadow:0 22px 75px #08222066; }
  .gate-icon { display:grid; place-items:center; width:44px; height:44px; margin-bottom:1.5rem; border-radius:.8rem; background:var(--mint); color:var(--teal); }
  .gate-card .eyebrow, .section-head .eyebrow, .checklist .eyebrow { color:var(--teal); }
  .gate-card h1 { margin:.5rem 0 .85rem; font-size:clamp(2rem,6vw,3.1rem); }
  .gate-card label { margin-top:1.5rem; }
  .gate-card .button { margin-top:.75rem; width:100%; }
  #lock-status { min-height:1.4rem; margin-top:.7rem; color:var(--rust); font-size:.9rem; }
  label { display:grid; gap:.35rem; font-size:.91rem; font-weight:650; }
  input[type=password],input[type=number],select { color:var(--ink); background:#fff; border:1px solid #a7b9b3; border-radius:.55rem; min-height:44px; padding:.48rem .65rem; width:100%; font-size:1rem; }
  input[type=range],input[type=checkbox] { accent-color:var(--teal); }
  .masthead { color:var(--cream); background:var(--dark); }
  .topbar { display:flex; flex-wrap:wrap; align-items:center; gap:.8rem 1.4rem; padding-block:1rem; border-bottom:1px solid #42615e; }
  .brand { font-weight:750; letter-spacing:.02em; color:inherit; text-decoration:none; }
  .topbar nav { display:flex; flex-wrap:wrap; gap:.45rem 1.2rem; margin-left:auto; }
  .topbar nav a { color:#d6e9e2; font-size:.9rem; text-decoration:none; }
  .topbar nav a:hover { text-decoration:underline; }
  .hero { display:grid; grid-template-columns:1fr auto; align-items:end; gap:2rem; padding-block:clamp(2.3rem,7vw,4.5rem); }
  .hero .eyebrow { color:#a3d9c1; }
  .hero h1 { margin:.55rem 0 1rem; font-size:clamp(2.6rem,7.5vw,5.3rem); }
  .hero-copy { color:#d4e6de; max-width:36rem; font-size:clamp(1rem,2.2vw,1.24rem); }
  .deadline { display:grid; gap:.3rem; padding:1.1rem 1.25rem; border:1px solid #557772; border-radius:.85rem; background:#183e3a; }
  .deadline strong { font-size:1.4rem; }
  .deadline span:last-child { color:#d4e6de; font-size:.89rem; }
  .guide { display:grid; gap:clamp(2.4rem,6vw,4.8rem); padding-block:clamp(2rem,6vw,4rem); }
  .section-head { display:grid; gap:.55rem; margin-bottom:1.35rem; }
  .section-head > p:last-child { color:var(--muted); max-width:64ch; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:1rem; }
  .picks, .details-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; }
  .pick,.detail { padding:1.25rem; }
  .pick h3 { margin:.65rem 0 .55rem; font-size:1.4rem; }
  .pick p,.detail p { color:var(--muted); }
  .detail h3 { margin-bottom:.65rem; }
  .detail p + p { margin-top:.7rem; }
  .tag { display:inline-block; color:var(--teal); background:var(--mint); border-radius:2rem; padding:.24rem .6rem; font-size:.78rem; font-weight:750; }
  .callout { margin-top:1rem; border-left:3px solid var(--teal); border-radius:.25rem .75rem .75rem .25rem; background:#e9f1e7; padding:.85rem 1rem; }
  .simulator { display:grid; grid-template-columns:minmax(220px,280px) minmax(0,1fr); }
  .controls,.results { display:grid; align-content:start; gap:.9rem; min-width:0; padding:1.3rem; }
  .controls { border-right:1px solid var(--line); background:#f9fbf6; border-radius:1rem 0 0 1rem; }
  .controls .check { display:flex; align-items:center; gap:.5rem; min-height:44px; }
  .check input { width:1.12rem; height:1.12rem; flex:none; }
  .supplement { display:grid; gap:.65rem; padding:.8rem; background:#e9f1e7; border-radius:.7rem; }
  .supplement .button { font-size:.86rem; }
  .legend { display:flex; flex-wrap:wrap; gap:1rem; font-size:.87rem; font-weight:650; }
  .legend span { display:inline-flex; align-items:center; gap:.4rem; }
  .swatch { width:1.25rem; height:.2rem; border-radius:1rem; background:var(--teal); }
  .swatch.traditional { background:repeating-linear-gradient(to right,var(--rust) 0 5px,transparent 5px 8px); }
  .chart { display:block; width:100%; height:270px; }
  .chart .tick { fill:var(--muted); font-size:11px; }
  .chart .axis-label { fill:var(--ink); font-size:12px; font-weight:650; }
  .chart .grid { stroke:var(--line); }
  .chart .cursor { stroke:#798b87; stroke-dasharray:3 4; }
  .chart .curve { fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
  .chart .hdhp { stroke:var(--teal); }
  .chart .traditional { stroke:var(--rust); stroke-dasharray:6 4; }
  .chart .point { stroke:white; stroke-width:2; }
  .spend { grid-template-columns:1fr auto; }
  .spend output { color:var(--teal); font-variant-numeric:tabular-nums; }
  .spend input { grid-column:1/-1; width:100%; min-height:32px; margin:0; }
  .plan-results { display:grid; grid-template-columns:1fr 1fr 1.3fr; gap:.55rem; }
  .plan-results > div { min-width:0; padding:.65rem .7rem; background:#f3f6ef; border-radius:.65rem; display:grid; gap:.15rem; align-content:start; }
  .plan-results span { font-size:.76rem; font-weight:750; }
  .plan-results strong { line-height:1.25; font-variant-numeric:tabular-nums; font-size:clamp(.98rem,2vw,1.25rem); }
  .plan-math { margin-top:.35rem; font-size:.78rem; line-height:1.5; color:var(--muted); white-space:pre-line; font-variant-numeric:tabular-nums; }
  .teal { color:var(--teal); }
  .rust { color:var(--rust); }
  .chart-note { margin:.7rem 0 1.2rem; }
  .fold { margin-top:1rem; padding:1rem 1.2rem; }
  summary { cursor:pointer; font-weight:750; }
  .table-wrap { overflow-x:auto; margin-top:.65rem; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; text-align:left; }
  th,td { padding:.55rem .6rem; border-bottom:1px solid var(--line); }
  td { font-variant-numeric:tabular-nums; }
  thead { color:var(--muted); }
  .fold p { margin-top:.6rem; }
  .checklist { display:grid; grid-template-columns:minmax(210px,1fr) 1.75fr; gap:1.5rem; padding:clamp(1.25rem,4vw,2rem); background:#edf4e9; }
  .checklist h2 { margin:.45rem 0 1rem; }
  .checklist ol { margin:0; padding-left:1.5rem; }
  .checklist li { padding-left:.3rem; }
  .checklist li + li { margin-top:.55rem; }
  .sources { border-top:1px solid var(--line); padding-top:1.2rem; }
  .sources h2 { font-size:1.15rem; margin-bottom:.65rem; }
  .sources div { display:flex; flex-wrap:wrap; gap:.55rem 1.05rem; font-size:.87rem; }
  @media (max-width:820px) { .picks,.details-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:660px) {
    .shell { width:calc(100% - 2rem); }
    .topbar nav { order:3; width:100%; margin:0; }
    .topbar .quiet { margin-left:auto; }
    .hero,.picks,.details-grid,.simulator,.checklist { grid-template-columns:1fr; }
    .hero { gap:1.15rem; }
    .deadline { justify-self:start; }
    .controls { border-right:0; border-bottom:1px solid var(--line); border-radius:1rem 1rem 0 0; }
    .controls,.results { padding:1rem; }
    .plan-results { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<main class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-icon" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></svg></div>
    <p class="eyebrow">2027 / Open enrollment</p>
    <h1>Health plan guide</h1>
    <p class="muted">Review the recommended elections, compare annual costs, and get ready to enroll.</p>
    <label for="password">Guide password</label>
    <input type="password" id="password" autocomplete="off" spellcheck="false" autocapitalize="off">
    <button type="button" class="button primary" id="unlock">Unlock guide</button>
    <p id="lock-status" role="status"></p>
  </div>
</main>
<div id="protected-guide" hidden></div>

  const gate = document.getElementById("gate");
  const protectedGuide = document.getElementById("protected-guide");
  const passwordField = document.getElementById("password");
  const unlockButton = document.getElementById("unlock");
  const status = document.getElementById("lock-status");
  const wholeDollar = new Intl.NumberFormat("en-US", {style:"currency", currency:"USD", maximumFractionDigits:0});
  const exactDollar = new Intl.NumberFormat("en-US", {style:"currency", currency:"USD"});
  const money = value => wholeDollar.format(value);
  const cents = value => Math.round(value * 100) / 100;
  let stopChart;

  async function decrypt(password) {
    const bytes = base64 => Uint8Array.from(atob(base64), character => character.charCodeAt(0));
    const subtle = crypto.subtle;
    const material = await subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await subtle.deriveKey(
      {name:"PBKDF2", salt:bytes(encrypted.salt), iterations:600000, hash:"SHA-256"},
      material, {name:"AES-GCM", length:256}, false, ["decrypt"]
    );
    const data = await subtle.decrypt({name:"AES-GCM", iv:bytes(encrypted.iv)}, key, bytes(encrypted.ciphertext));
    return JSON.parse(new TextDecoder().decode(data));
  }

  function model(plan, tier, people) {
    const rates = plan.tiers[tier];
    const hdhpFixed = cents(plan.payPeriods * rates.hdhp - rates.hsa);
    const traditionalFixed = cents(plan.payPeriods * rates.traditional);
    const advantage = traditionalFixed - hdhpFixed;
    const hdhpDeductible = plan.individualHdhpDeductible * people;
    const traditionalDeductible = plan.individualTraditionalDeductible * people;
    const cap = plan.individualCap * people;
    const breakEven = advantage < .8 * (hdhpDeductible - traditionalDeductible)
      ? [(advantage + .8 * traditionalDeductible) / .8, (cap - .8 * traditionalDeductible - advantage) / .2]
      : null;
    return {hdhpFixed, traditionalFixed, hdhpDeductible, traditionalDeductible, cap, breakEven};
  }

  function careCost(spending, deductible, cap) {
    const deductiblePaid = Math.min(spending, deductible, cap);
    const uncappedCoinsurance = cents(.2 * Math.max(0, spending - deductible));
    const coinsurance = Math.min(uncappedCoinsurance, cap - deductiblePaid);
    return {deductiblePaid, coinsurance, bills:cents(deductiblePaid + coinsurance), capped:coinsurance < uncappedCoinsurance};
  }

  function planCosts(spending, data, billsOnly, adjustment) {
    const cost = (deductible, fixed) => {
      const care = careCost(spending, deductible, data.cap);
      return {...care, total:cents(care.bills + (billsOnly ? 0 : fixed + adjustment))};
    };
    return [cost(data.hdhpDeductible, data.hdhpFixed), cost(data.traditionalDeductible, data.traditionalFixed)];
  }

  function planMath(care, paycheck, periods, hsa, supplement) {
    const price = value => exactDollar.format(value);
    const bills = `${price(care.deductiblePaid)} deductible + ${price(care.coinsurance)} coinsurance${care.capped ? " (out-of-pocket limit applied)" : ""}`;
    if (!periods) return bills;
    const annual = `${price(paycheck * periods)} premiums + ${price(care.bills)} medical bills`;
    const contribution = hsa ? ` − ${price(hsa)} employer HSA` : "";
    const indemnity = supplement ? ` + ${price(supplement.premium)} indemnity premium − ${price(supplement.cash)} payout` : "";
    return [annual + contribution + indemnity, `${price(paycheck)} per paycheck × ${periods} paychecks`, "Medical bills = " + bills].join("\n");
  }

  function drawChart(svg, data, billsOnly, adjustment, max, spending) {
    const width = Math.round(svg.clientWidth);
    const height = Math.round(svg.clientHeight);
    if (width < 100 || height < 100) return;
    const left = 67, top = 11, right = width - 14, bottom = height - 48;
    const xLabel = "Annual allowed charges ($)";
    const yLabel = billsOnly ? "Annual out-of-pocket bills ($)" : "Net annual cost ($)";
    const minY = billsOnly ? 0 : Math.min(0, -2000 + adjustment);
    const maxY = billsOnly ? data.cap : Math.max(0, data.cap + 2500 + adjustment);
    const x = value => left + value / max * (right - left);
    const y = value => bottom - (value - minY) / (maxY - minY) * (bottom - top);
    const compact = value => Math.abs(value) >= 1000 ? (value < 0 ? "−" : "") + "$" + Number((Math.abs(value)/1000).toFixed(1)) + "k" : money(value);
    const capAt = deductible => deductible + (data.cap - deductible) / .2;
    const turns = [0, data.traditionalDeductible, data.hdhpDeductible, capAt(data.hdhpDeductible), capAt(data.traditionalDeductible), max]
      .filter(value => value <= max).sort((a,b) => a-b);
    const curve = series => turns.map((charge,i) => (i ? "L" : "M") + x(charge) + " " + y(planCosts(charge,data,billsOnly,adjustment)[series].total)).join(" ");
    const [hdhp, traditional] = planCosts(spending,data,billsOnly,adjustment);
    const tickStep = Math.ceil((maxY - minY) / 2500) * 500;
    const yTicks = [];
    for (let value = Math.ceil(minY / tickStep) * tickStep; value <= maxY; value += tickStep) {
      yTicks.push(`<line class="grid" x1="${left}" x2="${right}" y1="${y(value)}" y2="${y(value)}"/><text class="tick" x="${left-8}" y="${y(value)+4}" text-anchor="end">${compact(value)}</text>`);
    }
    const divisions = width < 450 ? 4 : 5;
    const xTicks = Array.from({length:divisions+1}, (_,i) => {
      const value = max * i / divisions;
      const anchor = i === 0 ? "start" : i === divisions ? "end" : "middle";
      return `<text class="tick" x="${x(value)}" y="${bottom+19}" text-anchor="${anchor}">${compact(value)}</text>`;
    });
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("aria-label", `${yLabel} by ${xLabel} for HDHP and Traditional plans`);
    svg.innerHTML = yTicks.join("") + xTicks.join("") + `
      <text class="axis-label" x="${(left+right)/2}" y="${height-7}" text-anchor="middle">${xLabel}</text>
      <text class="axis-label" transform="translate(12 ${(top+bottom)/2}) rotate(-90)" text-anchor="middle">${yLabel}</text>
      <line class="cursor" x1="${x(spending)}" x2="${x(spending)}" y1="${top}" y2="${bottom}"/>
      <path class="curve hdhp" d="${curve(0)}"/>
      <path class="curve traditional" d="${curve(1)}"/>
      <circle class="point" fill="var(--teal)" cx="${x(spending)}" cy="${y(hdhp.total)}" r="5"/>
      <circle class="point" fill="var(--rust)" cx="${x(spending)}" cy="${y(traditional.total)}" r="5"/>`;
  }

  function startCalculator(plan) {
    const field = key => protectedGuide.querySelector("[data-" + key + "]");
    const tier = field("tier"), people = field("people"), metric = field("metric"), amount = field("amount");
    const hospital = field("hospital"), payout = field("hospital-payout"), chart = field("chart");
    function render() {
      if (tier.value === "employee") people.value = "1";
      people.disabled = tier.value === "employee";
      const data = model(plan, tier.value, Number(people.value));
      const max = people.value === "1" ? 25000 : 50000;
      amount.max = String(max);
      const spending = Number(amount.value);
      const billsOnly = metric.value === "bills";
      const premium = hospital.checked ? cents(12 * plan.hospitalRates[tier.value]) : 0;
      const cash = hospital.checked ? cents(Math.min(100000, Math.max(0, Number(payout.value) || 0))) : 0;
      const adjustment = cents(premium - cash);
      const [hdhpCare, traditionalCare] = planCosts(spending, data, billsOnly, adjustment);
      const hdhp = hdhpCare.total, traditional = traditionalCare.total;
      const rates = plan.tiers[tier.value];
      const price = value => exactDollar.format(value);
      const delta = cents(Math.abs(hdhp - traditional));
      const periods = billsOnly ? 0 : plan.payPeriods;
      const supplement = hospital.checked ? {premium,cash} : null;
      const operand = value => value < 0 ? `(${price(value)})` : price(value);
      field("hospital-controls").hidden = !hospital.checked;
      field("hospital-detail").textContent = `Annual premium ${price(premium)} · Estimated payout ${price(cash)}`;
      field("annual-rates").hidden = !billsOnly;
      field("annual-rates").textContent = `Annual premiums: HDHP ${price(rates.hdhp * plan.payPeriods)} · Traditional ${price(rates.traditional * plan.payPeriods)} · Employer HSA ${price(rates.hsa)}`;
      field("spend").value = money(spending);
      amount.setAttribute("aria-valuetext", money(spending));
      field("hdhp").textContent = price(hdhp);
      field("traditional").textContent = price(traditional);
      field("result").textContent = delta === 0 ? "Same cost" : `${hdhp < traditional ? "HDHP" : "Traditional"} by ${price(delta)}`;
      field("hdhp-math").textContent = planMath(hdhpCare, rates.hdhp, periods, rates.hsa, supplement);
      field("traditional-math").textContent = planMath(traditionalCare, rates.traditional, periods, 0, supplement);
      field("difference-math").textContent = `${operand(Math.max(hdhp, traditional))} − ${operand(Math.min(hdhp, traditional))} = ${price(delta)}`;
      field("break-even").textContent = billsOnly
        ? `Traditional bills are lower between ${money(data.traditionalDeductible)} and ${money(data.traditionalDeductible + (data.cap - data.traditionalDeductible) / .2)} in allowed charges.`
        : data.breakEven
          ? `Traditional costs less from about ${money(data.breakEven[0])} to ${money(data.breakEven[1])} in allowed charges. The HDHP costs less outside that range.`
          : "The HDHP costs less across the modeled range.";
      drawChart(chart, data, billsOnly, adjustment, max, spending);
    }
    for (const input of [tier, people, metric, hospital]) input.addEventListener("change", render);
    for (const input of [amount, payout]) input.addEventListener("input", render);
    field("first-day").addEventListener("click", () => { payout.value = String(plan.firstDayBenefit); render(); });
    const resize = new ResizeObserver(render);
    resize.observe(chart);
    render();
    return () => resize.disconnect();
  }

  function relock() {
    stopChart?.();
    stopChart = undefined;
    protectedGuide.replaceChildren();
    protectedGuide.hidden = true;
    gate.hidden = false;
    status.textContent = "";
    passwordField.value = "";
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    window.scrollTo(0, 0);
    passwordField.focus();
  }

  async function unlock() {
    if (unlockButton.disabled) return;
    if (!passwordField.value) {
      status.textContent = "Enter the guide password.";
      passwordField.focus();
      return;
    }
    unlockButton.disabled = true;
    status.textContent = "Unlocking…";
    let data;
    try {
      data = await decrypt(passwordField.value);
    } catch {
      status.textContent = globalThis.crypto?.subtle ? "That password didn’t unlock the guide. Try again." : "Open this guide in a browser that supports secure encryption.";
      passwordField.select();
    } finally {
      unlockButton.disabled = false;
    }
    if (!data) return;
    passwordField.value = "";
    status.textContent = "";
    // This markup is authored with the guide and authenticated by AES-GCM.
    protectedGuide.innerHTML = data.guide;
    protectedGuide.hidden = false;
    gate.hidden = true;
    document.getElementById("relock").addEventListener("click", relock);
    stopChart = startCalculator(data.plan);
    document.getElementById("guide-title").focus({preventScroll:true});
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  }

  unlockButton.addEventListener("click", unlock);
  passwordField.addEventListener("keydown", event => {
    if (event.key === "Enter") { event.preventDefault(); unlock(); }
  });
</script>
</body>
</html>
